[workspace]
resolver = "3"
members = [
    "crates/codegauge-model",
    "crates/codegauge-core",
    "crates/codegauge-application",
    "crates/codegauge-provider-jacoco",
    "crates/codegauge-cli",
    "crates/codegauge-conformance",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/yacosta738/codegauge"
readme = "README.md"

[workspace.dependencies]
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
quick-xml = { version = "=0.41.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
clap = { version = "=4.6.6", default-features = false, features = ["derive", "std"] }
