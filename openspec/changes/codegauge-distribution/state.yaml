summary: |
  Specification and design define production CI/CD and distribution slices for Cargo/source, npm,
  OCI, and GitHub Release channels while preserving engine and contract semantics. R-F6 uses the
  verified two-stage architecture: Release Please 17.6.0 produces one component-tagged,
  release-free synchronization PR from five explicit runtime Cargo candidates plus the Java root
  carrier, then a trusted post-merge carrier owns exactly one immutable unprefixed tag. The exact
  read-only runtime chain and effective changeset probe pass with six optional pin rewrites, no
  private/unapproved Stage-A paths, and zero release/tag calls; local quality and security checks
  are green. The carrier now correlates the exact event SHA before validation: ordinary main pushes
  with no matching Release Please PR are successful auditable no-ops, exactly one match follows the
  full carrier path, and multiple/malformed data fail closed. Fresh local sdd-verify passed every
  requested local contract with PASS WITH WARNINGS. The temporary manual/repository-variable dry-run
  mode still emits a credential-free plan while preserving the live push default. Acceptance remains
  BLOCKED because hosted execution, publication, native non-host target evidence, attestation, and
  rollback remain unverified and unauthorized; independent sdd-qa is next.

decision:
  r_f6: option-1-two-stage-version-pr-and-post-merge-tag-carrier
  release_please_version: "17.6.0"
  stage_1_private_boundary: "explicit-five-runtime-cargo-list-plus-non-cargo-root-carrier"
  stage_1_expected_artifacts: "one synchronized PR; zero tags and GitHub Releases"
  stage_2_canonical_tag: "exactly one immutable vX.Y.Z at the validated merge SHA"

