name: Release Please Stage A

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-stage-a-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A repository-scoped token keeps checks on the generated PR eligible to run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # v5.0.0 calls Manifest.createReleases only when this supported input is false.
          # The linked candidates would otherwise be named component-vX.Y.Z; here they are PR
          # metadata only, and the trusted carrier is the sole owner of unprefixed vX.Y.Z.
          skip-github-release: true
