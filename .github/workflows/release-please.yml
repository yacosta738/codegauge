name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs['crates/codegauge-cli--release_created'] }}
      release_tag: ${{ steps.release.outputs['crates/codegauge-cli--tag_name'] }}
      release_sha: ${{ steps.release.outputs['crates/codegauge-cli--sha'] }}
      release_url: ${{ steps.release.outputs['crates/codegauge-cli--html_url'] }}

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.release_tag }}
      release_sha: ${{ needs.release-please.outputs.release_sha }}
      main_sha: ${{ github.sha }}
      release_url: ${{ needs.release-please.outputs.release_url }}
      dry_run: false
    secrets: inherit
