name: Release Publish

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Exact canonical vX.Y.Z tag"
        required: true
        type: string
      release_sha:
        description: "Exact commit SHA resolved by the canonical tag"
        required: true
        type: string
      main_sha:
        description: "Expected merged-main commit SHA"
        required: true
        type: string
      release_url:
        description: "Optional pre-existing release URL for compatibility"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Build and verify without publishing"
        required: false
        default: true
        type: boolean
      recovery:
        description: "Explicit recovery dispatch for an existing canonical tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_REF: ${{ inputs.release_tag }}
  RELEASE_SHA: ${{ inputs.release_sha }}
  MAIN_SHA: ${{ inputs.main_sha }}
  RELEASE_URL: ${{ inputs.release_url }}
  DRY_RUN: ${{ inputs.dry_run }}
  RUST_TOOLCHAIN: 1.97.1
  CARGO_TERM_COLOR: always

jobs:
  publish-cargo-model:
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Dry-run and publish leaf Cargo crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p codegauge-model --locked --dry-run
          cargo publish -p codegauge-model --locked

  publish-cargo-core:
    needs: publish-cargo-model
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Dry-run and publish Cargo core crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          sleep 30
          cargo publish -p codegauge-core --locked --dry-run
          cargo publish -p codegauge-core --locked

  publish-cargo-application:
    needs: publish-cargo-core
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Dry-run and publish Cargo application crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          sleep 30
          cargo publish -p codegauge-application --locked --dry-run
          cargo publish -p codegauge-application --locked

  publish-cargo-provider:
    needs: publish-cargo-application
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Dry-run and publish JaCoCo provider crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          sleep 30
          cargo publish -p codegauge-provider-jacoco --locked --dry-run
          cargo publish -p codegauge-provider-jacoco --locked

  publish-cargo-provider-typescript:
    needs: publish-cargo-provider
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Dry-run and publish TypeScript provider crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          sleep 30
          cargo publish -p codegauge-provider-typescript --locked --dry-run
          cargo publish -p codegauge-provider-typescript --locked

  publish-cargo-cli:
    needs: publish-cargo-provider-typescript
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Dry-run and publish CLI Cargo crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          sleep 30
          cargo publish -p codegauge-cli --locked --dry-run
          cargo publish -p codegauge-cli --locked

  publish-release:
    needs: publish-cargo-cli
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: release-out
          merge-multiple: true
      - name: Verify sidecars before GitHub upload
        run: |
          set -euo pipefail
          find release-out -name '*.sha256' -print0 | xargs -0 -n1 sh -c "cd \"\$(dirname \"\$0\")\" && sha256sum --check \"\$(basename \"\$0\")\""
      - name: Verify existing canonical GitHub Release after all gates
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "${RELEASE_REF}" --repo "$GITHUB_REPOSITORY" --json tagName,url)"
          test "$(printf '%s' "$release_json" | jq -r .tagName)" = "$RELEASE_REF"
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_REF}")"
          test "$(printf '%s' "$tag_json" | jq -r .object.type)" = "commit"
          test "$(printf '%s' "$tag_json" | jq -r .object.sha)" = "$RELEASE_SHA"
          if [[ -n "$RELEASE_URL" ]]; then
            test "$(printf '%s' "$release_json" | jq -r .url)" = "$RELEASE_URL"
          fi
      - name: Upload verified assets to the existing release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh release upload "${RELEASE_REF}" release-out/* --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/*

  publish-npm:
    needs: publish-release
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: npm/packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: release-out
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Publish verified platform packages, then wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          RELEASE_TAG="${RELEASE_REF}"
          test "$(git describe --tags --exact-match HEAD)" = "${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${RELEASE_SHA}"
          SOURCE_REVISION="${RELEASE_SHA}"
          RELEASE_VERSION="${RELEASE_REF#v}"
          npm --prefix npm/codegauge install --omit=optional --ignore-scripts --no-audit --no-fund --no-package-lock
          npm --prefix npm/codegauge run build
          node npm/codegauge/dist/preflight.js \
            --release-version "${RELEASE_VERSION}" \
            --source-revision "${SOURCE_REVISION}" \
            --release-out release-out \
            --npm-root npm
          (cd npm/packages/codegauge-linux-x64-gnu && npm publish --provenance --access public)
          (cd npm/packages/codegauge-linux-arm64-gnu && npm publish --provenance --access public)
          (cd npm/packages/codegauge-darwin-x64 && npm publish --provenance --access public)
          (cd npm/packages/codegauge-darwin-arm64 && npm publish --provenance --access public)
          (cd npm/packages/codegauge-win32-x64-msvc && npm publish --provenance --access public)
          (cd npm/packages/codegauge-win32-arm64-msvc && npm publish --provenance --access public)
          (cd npm/codegauge && npm publish --provenance --access public)

  publish-oci:
    needs: publish-npm
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Download verified OCI build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oci-build-evidence-${{ inputs.release_tag }}
          path: oci-evidence
      - name: Load verified OCI architecture images
        run: |
          set -euo pipefail
          docker load --input oci-evidence/amd64.docker.tar
          docker load --input oci-evidence/arm64.docker.tar
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish final verified OCI digests
        id: publish-manifest
        env:
          IMAGE: ghcr.io/yacosta738/codegauge
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_REF#v}"
          amd64_digest=""
          arm64_digest=""
          for architecture in amd64 arm64; do
            STAGING_IMAGE="codegauge-oci-${architecture}:${RELEASE_SHA}"
            FINAL_TAG="$IMAGE:${RELEASE_VERSION}-${architecture}"
            EVIDENCE_OUTPUT="oci-evidence/${architecture}.json"
            docker tag "$STAGING_IMAGE" "$FINAL_TAG"
            docker push "$FINAL_TAG" 2>&1 | tee "oci-evidence/${architecture}.push.log"
            REMOTE_MANIFEST="$(docker buildx imagetools inspect --raw "$FINAL_TAG")"
            EXPECTED_OCI_CONFIG_DIGEST="$(jq -er '.oci_config_digest' "$EVIDENCE_OUTPUT")"
            PUBLISHED_CONFIG_DIGEST="$(printf '%s' "$REMOTE_MANIFEST" | jq -er '.config.digest')"
            test "$PUBLISHED_CONFIG_DIGEST" = "$EXPECTED_OCI_CONFIG_DIGEST"
            PUBLISHED_DIGEST="$(docker buildx imagetools inspect "$FINAL_TAG" --format '{{json .Manifest}}' | jq -er '.digest')"
            jq -en --arg digest "$PUBLISHED_DIGEST" '$digest | test("^sha256:[0-9a-f]{64}$")'
            jq --exit-status \
              --arg digest "$PUBLISHED_DIGEST" \
              --arg config_digest "$PUBLISHED_CONFIG_DIGEST" \
              --arg reference "$FINAL_TAG" \
              'select(.verified == true) | .published_digest = $digest | .published_config_digest = $config_digest | .published_reference = $reference' \
              "$EVIDENCE_OUTPUT" > "${EVIDENCE_OUTPUT}.tmp"
            mv "${EVIDENCE_OUTPUT}.tmp" "$EVIDENCE_OUTPUT"
            if [[ "$architecture" == "amd64" ]]; then
              amd64_digest="$PUBLISHED_DIGEST"
            else
              arm64_digest="$PUBLISHED_DIGEST"
            fi
          done
          test -n "$amd64_digest"
          test -n "$arm64_digest"
          docker buildx imagetools create \
            --tag "$IMAGE:${RELEASE_VERSION}" \
            "$IMAGE@${amd64_digest}" \
            "$IMAGE@${arm64_digest}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE@${amd64_digest}" \
            "$IMAGE@${arm64_digest}"
          FINAL_RAW="$(docker buildx imagetools inspect --raw "$IMAGE:${RELEASE_VERSION}")"
          jq -e \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" \
            '([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64" and .digest == $amd64)] | length == 1) and ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $arm64)] | length == 1)' \
            <<< "$FINAL_RAW"
          FINAL_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:${RELEASE_VERSION}")"
          jq -en --arg digest "$FINAL_DIGEST" '$digest | test("^sha256:[0-9a-f]{64}$")'
          LATEST_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:latest")"
          test "$LATEST_DIGEST" = "$FINAL_DIGEST"
          printf '%s\n' "$FINAL_DIGEST" > oci-evidence/manifest.digest
          printf 'manifest_digest=%s\n' "$FINAL_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest verified OCI manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/yacosta738/codegauge
          subject-digest: ${{ steps.publish-manifest.outputs.manifest_digest }}
          push-to-registry: true
      - name: OCI architecture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-evidence-${{ inputs.release_tag }}
          path: oci-evidence/
          if-no-files-found: error
          retention-days: 14

  publication-failure-inventory:
    # Keep the dependency chain observable without turning failure handling into
    # a rollback or a second publication writer.
    needs: [publish-cargo-model, publish-cargo-core, publish-cargo-application, publish-cargo-provider, publish-cargo-provider-typescript, publish-cargo-cli, publish-release, publish-npm, publish-oci]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write audit-only publication inventory
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
          RELEASE_REF: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MAIN_SHA: ${{ inputs.main_sha }}
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${RELEASE_REF#v}"
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_RESULTS"])
          release_ref = os.environ["RELEASE_REF"]
          release_version = os.environ["RELEASE_VERSION"]
          release_sha = os.environ["RELEASE_SHA"]

          def job_result(job):
              value = needs.get(job, {})
              return value.get("result", "UNKNOWN") if isinstance(value, dict) else "UNKNOWN"

          targets = []

          def add(target, kind, job, evidence_location):
              targets.append(
                  {
                      "target": target,
                      "kind": kind,
                      "canonical_version": release_version,
                      "canonical_reference": release_ref,
                      "source_sha": release_sha,
                      "published_digest_or_package_version": "UNKNOWN",
                      "job_result": job_result(job),
                      "evidence_location": evidence_location,
                  }
              )

          cargo_crates = (
              "codegauge-model",
              "codegauge-core",
              "codegauge-application",
              "codegauge-provider-jacoco",
              "codegauge-provider-typescript",
              "codegauge-cli",
          )
          cargo_jobs = {
              "codegauge-model": "publish-cargo-model",
              "codegauge-core": "publish-cargo-core",
              "codegauge-application": "publish-cargo-application",
              "codegauge-provider-jacoco": "publish-cargo-provider",
              "codegauge-provider-typescript": "publish-cargo-provider-typescript",
              "codegauge-cli": "publish-cargo-cli",
          }
          for crate in cargo_crates:
              job = cargo_jobs[crate]
              add(
                  crate,
                  "cargo-crate",
                  job,
                  f"job://{job}/cargo-publish --locked; artifact://publication-failure-inventory-{release_ref}",
              )

          npm_packages = (
              "@yacosta738/codegauge",
              "@yacosta738/codegauge-linux-x64-gnu",
              "@yacosta738/codegauge-linux-arm64-gnu",
              "@yacosta738/codegauge-darwin-x64",
              "@yacosta738/codegauge-darwin-arm64",
              "@yacosta738/codegauge-win32-x64-msvc",
              "@yacosta738/codegauge-win32-arm64-msvc",
          )
          for package in npm_packages:
              add(
                  package,
                  "npm-package",
                  "publish-npm",
                  f"job://publish-npm/npm publish {package}; artifact://publication-failure-inventory-{release_ref}",
              )

          # The v0.3.0 catalog is: codegauge-0.3.0-x86_64-unknown-linux-gnu.tar.gz,
          # codegauge-0.3.0-aarch64-unknown-linux-gnu.tar.gz,
          # codegauge-0.3.0-x86_64-unknown-linux-musl.tar.gz,
          # codegauge-0.3.0-aarch64-unknown-linux-musl.tar.gz,
          # codegauge-0.3.0-x86_64-apple-darwin.tar.gz,
          # codegauge-0.3.0-aarch64-apple-darwin.tar.gz,
          # codegauge-0.3.0-x86_64-pc-windows-msvc.zip, and
          # codegauge-0.3.0-aarch64-pc-windows-msvc.zip.
          archive_targets = (
              ("x86_64-unknown-linux-gnu", "tar.gz"),
              ("aarch64-unknown-linux-gnu", "tar.gz"),
              ("x86_64-unknown-linux-musl", "tar.gz"),
              ("aarch64-unknown-linux-musl", "tar.gz"),
              ("x86_64-apple-darwin", "tar.gz"),
              ("aarch64-apple-darwin", "tar.gz"),
              ("x86_64-pc-windows-msvc", "zip"),
              ("aarch64-pc-windows-msvc", "zip"),
          )
          for target, extension in archive_targets:
              archive = f"codegauge-{release_version}-{target}.{extension}"
              source = f"job://archives/{target}/release-out/{archive}"
              add(archive, "github-release-asset", "publish-release", source)
              add(f"{archive}.sha256", "github-release-checksum", "publish-release", f"{source}.sha256")
              add(
                  f"release-manifest-{target}.json",
                  "github-release-evidence",
                  "publish-release",
                  f"job://archives/{target}/release-out/release-manifest-{target}.json",
              )

          image = "ghcr.io/yacosta738/codegauge"
          # The v0.3.0 OCI catalog is ghcr.io/yacosta738/codegauge:0.3.0-amd64,
          # ghcr.io/yacosta738/codegauge:0.3.0-arm64, and
          # ghcr.io/yacosta738/codegauge:0.3.0.
          oci_architecture_targets = ("amd64", "arm64")
          for architecture in oci_architecture_targets:
              reference = f"{image}:{release_version}-{architecture}"
              add(
                  reference,
                  "oci-architecture-manifest",
                  "publish-oci",
                  f"job://publish-oci/oci-evidence/{architecture}.json",
              )
          final_reference = f"{image}:{release_version}"
          add(
              final_reference,
              "oci-final-manifest",
              "publish-oci",
              "job://publish-oci/oci-evidence/manifest.digest",
          )
          latest_reference = "ghcr.io/yacosta738/codegauge:latest"
          add(
              latest_reference,
              "oci-mutable-alias",
              "publish-oci",
              "job://publish-oci/oci-evidence/manifest.digest",
          )
          add(
              "attestation: ghcr.io/yacosta738/codegauge@UNKNOWN",
              "oci-attestation",
              "publish-oci",
              "job://publish-oci/attest-build-provenance",
          )

          inventory = {
              "schema": "publication-failure-inventory/v1",
              "canonical_version": release_version,
              "canonical_reference": release_ref,
              "source_sha": release_sha,
              "merged_main_sha": os.environ["MAIN_SHA"],
              "policy": "No rollback, deletion, or force-move is performed here.",
              "stop_chain": "Stop later publication stages after the first failed dependency.",
              "republish_policy": "This audit-only inventory never republishes immutable outputs.",
              "runbook": "docs/release-recovery-runbook.md",
              "job_results": {
                  job: job_result(job)
                  for job in sorted(needs)
              },
              "targets": targets,
          }
          with open("publication-failure-inventory.json", "w", encoding="utf-8") as stream:
              json.dump(inventory, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Upload publication failure inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-failure-inventory-${{ inputs.release_tag }}
          path: publication-failure-inventory.json
          if-no-files-found: error
          retention-days: 30
