name: Release Tag Carrier

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the merged-main carrier without tag, label, release, or publication writes"
        required: true
        default: true
        type: boolean
      replay_sha:
        description: "Historical merged-main SHA to replay read-only; valid only with dry_run=true"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-carrier-main
  cancel-in-progress: false

jobs:
  carry-release-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve carrier mode
        id: mode
        env:
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY_DRY_RUN: ${{ vars.RELEASE_CARRIER_DRY_RUN }}
          REPLAY_SHA: ${{ inputs.replay_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${DISPATCH_DRY_RUN:-}" in
              true) dry_run=true ;;
              false) dry_run=false ;;
              *)
                printf 'workflow_dispatch dry_run must be true or false, got %q\n' "${DISPATCH_DRY_RUN:-}" >&2
                exit 1
                ;;
            esac
          else
            case "${REPOSITORY_DRY_RUN:-}" in
              ""|false) dry_run=false ;;
              true) dry_run=true ;;
              *)
                printf 'RELEASE_CARRIER_DRY_RUN must be true, false, or unset, got %q\n' "${REPOSITORY_DRY_RUN:-}" >&2
                exit 1
                ;;
            esac
          fi
          source_checkout_sha="$(git rev-parse HEAD)"
          event_resolution="$(python3 scripts/verify_release_provenance.py carrier-event-sha \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA" \
            --replay-sha "${REPLAY_SHA:-}" \
            --dry-run "$dry_run")"
          event_sha="$(jq -er '.event_sha' <<<"$event_resolution")"
          replay_mode="$(jq -r '
            (.replay // false) as $replay
            | if ($replay | type) == "boolean"
              then ($replay | tostring)
              else error("replay must be a boolean")
              end
          ' <<<"$event_resolution")"
          test "$source_checkout_sha" = "$(jq -er '.source_sha' <<<"$event_resolution")"
          if [[ "$dry_run" == "true" ]]; then
            mode="dry-run"
          else
            mode="live"
          fi
          {
            printf 'dry_run=%s\n' "$dry_run"
            printf 'mode=%s\n' "$mode"
            printf 'event_sha=%s\n' "$event_sha"
            printf 'replay=%s\n' "$replay_mode"
            printf 'source_checkout_sha=%s\n' "$source_checkout_sha"
          } >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' '## Release carrier mode'
            printf -- '- event: %s\n' "$GITHUB_EVENT_NAME"
            printf -- '- ref: %s\n' "$GITHUB_REF"
            printf -- '- normalized mode: %s\n' "$mode"
            printf -- '- replay: %s\n' "$replay_mode"
            printf -- '- source checkout SHA: %s\n' "$source_checkout_sha"
            printf -- '- effective event SHA: %s\n' "$event_sha"
            printf -- '- dry-run: %s\n' "$dry_run"
            if [[ "$replay_mode" == "true" ]]; then
              printf -- '- replay event SHA: %s\n' "$event_sha"
            else
              printf '%s\n' '- replay event SHA: none'
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              printf '%s\n' '- automatic push mode uses vars.RELEASE_CARRIER_DRY_RUN; unset/false is live'
            elif [[ "$replay_mode" == "true" ]]; then
              printf '%s\n' '- replay is read-only and dry-run-only; historical event SHA is used for correlation'
            else
              printf '%s\n' '- manual dispatch mode uses the required dry_run input'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the one merged Release Please PR
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ steps.mode.outputs.event_sha }}
          SOURCE_CHECKOUT_SHA: ${{ steps.mode.outputs.source_checkout_sha }}
          REPLAY_MODE: ${{ steps.mode.outputs.replay }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NORMALIZED_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # jq variables are supplied with --arg/--argjson.
          test -n "${GH_TOKEN:-}"
          test "$GITHUB_EVENT_NAME" = "push" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_CHECKOUT_SHA"
          carrier_input_dir="$RUNNER_TEMP/codegauge-carrier"
          mkdir -p "$carrier_input_dir"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${EVENT_SHA}/pulls" \
            -H 'Accept: application/vnd.github+json' \
            | jq -e 'if (type == "array" and all(.[]; type == "array")) then (add // []) else error("GitHub pull-request response must contain arrays") end' \
            > carrier-pull-requests.json
          mv carrier-pull-requests.json "$carrier_input_dir/pull-requests.json"
          selection="$(python3 scripts/verify_release_provenance.py carrier-pr-selection \
            --event-sha "$EVENT_SHA" \
            --pull-requests "$carrier_input_dir/pull-requests.json")"
          printf '%s\n' "$selection" > "$carrier_input_dir/selection.json"
          selection_status="$(jq -er '.status' <<<"$selection")"
          case "$selection_status" in
            skipped)
              test "$(jq -er '.matching_release_pr_count' <<<"$selection")" -eq 0
              # shellcheck disable=SC2016 # jq variables are supplied with --arg/--argjson.
              jq -n \
                --arg event_name "$GITHUB_EVENT_NAME" \
                --arg event_ref "$GITHUB_REF" \
                --arg event_sha "$EVENT_SHA" \
                --arg source_checkout_sha "$SOURCE_CHECKOUT_SHA" \
                --arg replay_mode "$REPLAY_MODE" \
                --arg dry_run "$DRY_RUN" \
                --arg normalized_mode "$NORMALIZED_MODE" \
                --argjson selection "$selection" \
                "{
                  status: \"skipped\",
                  reason: \$selection.reason,
                  replay: (\$replay_mode == \"true\"),
                  mode: {
                    dry_run: (\$dry_run == \"true\"),
                    normalized: \$normalized_mode,
                    replay: (\$replay_mode == \"true\")
                  },
                  source_checkout_sha: \$source_checkout_sha,
                  event: {
                    name: \$event_name,
                    ref: \$event_ref,
                    sha: \$event_sha
                  },
                  replay_event_sha: (if \$replay_mode == \"true\" then \$event_sha else null end),
                  matching_release_pr_count: \$selection.matching_release_pr_count,
                  mutations: {
                    carrier_validation: \"not-run\",
                    canonical_tag_ref: \"not-started\",
                    version_pr_label: \"not-started\",
                    release_on_tag_workflow: \"not-dispatched\",
                    release_asset_upload: \"not-started\",
                    cargo_publication: \"not-started\",
                    npm_publication: \"not-started\",
                    oci_publication: \"not-started\",
                    attestation: \"not-started\",
                    publication: \"not-started\"
                  }
                }" > carrier-record.json
              printf 'status=skipped\n' >> "$GITHUB_OUTPUT"
              printf 'reason=no-matching-release-please-pr\n' >> "$GITHUB_OUTPUT"
              {
                printf '%s\n' '## Release carrier skipped'
                printf -- '- status: skipped\n'
                printf -- '- reason: no matching merged Release Please PR for effective event SHA\n'
                printf -- '- replay: %s\n' "$REPLAY_MODE"
                printf -- '- source checkout SHA: %s\n' "$SOURCE_CHECKOUT_SHA"
                printf -- '- effective event SHA: %s\n' "$EVENT_SHA"
                printf -- '- dry-run: %s\n' "$DRY_RUN"
                if [[ "$REPLAY_MODE" == "true" ]]; then
                  printf -- '- replay event SHA: %s\n' "$EVENT_SHA"
                else
                  printf '%s\n' '- replay event SHA: none'
                fi
                printf -- '- event: %s on %s at %s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$EVENT_SHA"
                printf -- '- record: carrier-record.json\n'
                printf '%s\n' '- mutations: validation, tag, label, release, upload, publication, and attestation paths were not run'
              } >> "$GITHUB_STEP_SUMMARY"
              cat carrier-record.json
              exit 0
              ;;
            matched)
              test "$(jq -er '.matching_release_pr_count' <<<"$selection")" -eq 1
              release_pr_number="$(jq -er '.version_pr_number' <<<"$selection")"
              printf 'status=matched\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              printf 'carrier PR selection returned an invalid status: %s\n' "$selection_status" >&2
              exit 1
              ;;
          esac
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${release_pr_number}/files" \
            -H 'Accept: application/vnd.github+json' \
            | jq -e 'add | map({filename: .filename, status: .status, additions: .additions, deletions: .deletions, changes: .changes, patch: .patch})' > "$carrier_input_dir/files.json"

      - name: Validate the merged tree and version PR
        id: carrier
        if: steps.collect.outputs.status == 'matched'
        env:
          EVENT_SHA: ${{ steps.mode.outputs.event_sha }}
          SOURCE_CHECKOUT_SHA: ${{ steps.mode.outputs.source_checkout_sha }}
          REPLAY_MODE: ${{ steps.mode.outputs.replay }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NORMALIZED_MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          record="$(python3 scripts/verify_release_provenance.py carrier \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --event-sha "$EVENT_SHA" \
            --pull-requests "$RUNNER_TEMP/codegauge-carrier/pull-requests.json" \
            --pull-request-files "$RUNNER_TEMP/codegauge-carrier/files.json" \
            --root "$GITHUB_WORKSPACE" \
            --require-clean)"
          jq -n \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg event_ref "$GITHUB_REF" \
            --arg event_sha "$EVENT_SHA" \
            --arg source_checkout_sha "$SOURCE_CHECKOUT_SHA" \
            --arg replay_mode "$REPLAY_MODE" \
            --arg dry_run "$DRY_RUN" \
            --arg normalized_mode "$NORMALIZED_MODE" \
            --argjson carrier "$record" \
            '$carrier + {
                replay: ($replay_mode == "true"),
                mode: {
                  dry_run: ($dry_run == "true"),
                  normalized: $normalized_mode,
                  replay: ($replay_mode == "true")
                },
                source_checkout_sha: $source_checkout_sha,
                event: {
                  name: $event_name,
                  ref: $event_ref,
                  sha: $event_sha
                },
                 replay_event_sha: (if $replay_mode == "true" then $event_sha else null end),
                 validation: {
                   stage_a_diff: "passed",
                   tree: "clean",
                   provenance: "passed"
                 },
                 mutations: {

                  carrier_validation: "passed",
                  canonical_tag_ref: "not-started",
                  version_pr_label: "not-started",
                  release_on_tag_workflow: "not-dispatched",
                  release_asset_upload: "not-started",
                  cargo_publication: "not-started",
                  npm_publication: "not-started",
                  oci_publication: "not-started",
                  attestation: "not-started",
                  publication: "not-started"
                }
              }' > carrier-record.json
          jq -er '.tag, .merge_sha, .version_pr_number' carrier-record.json
          printf 'tag=%s\n' "$(jq -er '.tag' carrier-record.json)" >> "$GITHUB_OUTPUT"

      - name: Validate canonical release owner is external
        if: steps.collect.outputs.status == 'matched'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ steps.mode.outputs.event_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${EVENT_SHA}/pulls" >/dev/null
